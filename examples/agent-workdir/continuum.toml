[project]
name = "agent-workdir"
version = "0.1.0"

[policy]
bundle = "policies/main.arb"

[audit]
kind = "jsonl"
path = ".continuum/audit.jsonl"

[subject]
default_kind = "agent"
default_mode = "ask"

[capabilities]
horizon_manifest_dir = ".continuum/capabilities"
manifest_signature_mode = "off"
manifest_signature_public_keys = ""
manifest_digest_pins = ""

[state]
policy_store = ".continuum/policies.json"
grant_store = ".continuum/grants.json"
delivery_store = ".continuum/deliveries.json"
session_store = ".continuum/sessions.json"
airlock_store = ".continuum/airlock.json"
airlock_accumulator_store = ".continuum/airlock-accumulators.json"
id_store = ".continuum/ids.json"

[daemon]
cors_origins = ""

[grant]
max_ttl = "24h"

[enforcement]
network = "observe"
file = "observe"
process = "observe"

[approval]
kind = "cli"
